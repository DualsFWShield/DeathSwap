# BlockShuffle Configuration
# Each block/item can be individually enabled/disabled with custom difficulty.
# difficulty: 1 = Easy, 2 = Medium, 3 = Hard
# type: STAND (stand on block) or CRAFT (craft the item)
#
# The plugin uses these defaults if this file is empty.
# You can modify difficulty, toggle entries on/off, etc.

blocks:
  # ─── Easy (Difficulty 1) ───
  # Stand
  DIRT:
    enabled: true
    difficulty: 1
    type: STAND
  OAK_LOG:
    enabled: true
    difficulty: 1
    type: STAND
  COBBLESTONE:
