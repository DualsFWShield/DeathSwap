# DeathShuffle Configuration
# Each death cause can be individually enabled/disabled with custom difficulty.
# difficulty: 1 = Easy, 2 = Medium, 3 = Hard
#
# The plugin uses these defaults if this file is empty.
# You can modify difficulty, toggle entries on/off, etc.

causes:
  # ─── Easy (Difficulty 1) ───
  DROWNING:
    enabled: true
    difficulty: 1
  FALL:
    enabled: true
    difficulty: 1
  FIRE:
    enabled: true
    difficulty: 1
  FIRE_TICK:
    enabled: true
    difficulty: 1
  CONTACT:
    enabled: true
    difficulty: 1
  STARVATION:
    enabled: true
    difficulty: 1
  SUFFOCATION:
    enabled: true
    difficulty: 1
  CAMPFIRE:
    enabled: true
    difficulty: 1
  ENTITY_ATTACK:
    enabled: true
    difficulty: 1
  FALLING_BLOCK:
    enabled: true
    difficulty: 1

  # ─── Medium (Difficulty 2) ───
  LAVA:
    enabled: true
    difficulty: 2
  ENTITY_EXPLOSION:
    enabled: true
    difficulty: 2
  PROJECTILE:
    enabled: true
    difficulty: 2
  MAGIC:
    enabled: true
    difficulty: 2
  HOT_FLOOR:
    enabled: true
    difficulty: 2
  FREEZE:
    enabled: true
    difficulty: 2
  POISON:
    enabled: false
    difficulty: 2
  THORNS:
    enabled: false
    difficulty: 2
  ENTITY_SWEEP_ATTACK:
    enabled: true
    difficulty: 2
  BLOCK_EXPLOSION:
    enabled: true
    difficulty: 2

  # ─── Hard (Difficulty 3) ───
  LIGHTNING:
    enabled: false
    difficulty: 3
  FLY_INTO_WALL:
    enabled: false
    difficulty: 3
  VOID:
    enabled: true
    difficulty: 3
  WITHER:
    enabled: false
    difficulty: 3
  DRAGON_BREATH:
    enabled: false
    difficulty: 3
  CRAMMING:
    enabled: false
    difficulty: 3
  SONIC_BOOM:
    enabled: false
    difficulty: 3
  WORLD_BORDER:
    enabled: false
    difficulty: 3
  SUICIDE:
    enabled: false
    difficulty: 3
