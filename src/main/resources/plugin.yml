name: DeathSwap
version: ${project.version}
main: be.dualsfwshield.deathswap.DeathSwapPlugin
api-version: '1.21' # Tested on 1.21.1
description: Professional DeathSwap minigame with DeathShuffle and BlockShuffle modes
authors: [DualsFWShield]
website: https://dualsfwshield.be

softdepend:
  - Multiverse-Core
  - CyberWorldReset

commands:
  ds:
    description: DeathSwap main command
    usage: /ds <join|leave|start|stop|swapnow|stats|top|vote|list|tp>
    aliases: [deathswap]

permissions:
  deathswap.admin:
    description: Full admin access to DeathSwap
    default: op
  deathswap.play:
    description: Can play DeathSwap
    default: true
